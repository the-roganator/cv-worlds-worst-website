# The daily scan: every image, chart and lockfile this repository runs or pins, read against the day's advisories,
# each finding an alert in this repository's code scanning, in the categories `vulnerabilities/01` to
# `vulnerabilities/20`.
#
# The scan lives in Software Factory's repository and is called at a pinned commit, which holds the list of what is
# scanned here and the scanner's own pin, so a change here cannot narrow it. It checks this repository out as data
# and runs nothing from it. It runs daily, for the day's new advisories, and on each push to main, for what changed.
name: vulnerabilities

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'

permissions: {}

jobs:
  vulnerabilities:
    permissions:
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: write # upload the results to code scanning
    uses: the-roganator/cv-software-factory/.github/workflows/vulnerabilities.yml@ac19619ac613b0dd58f9078b3f22b07c009d8f5d # main
