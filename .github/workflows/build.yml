# Builds the shop's image on main and pushes it to GHCR, tagged and labelled with the commit it was built from, then
# signs it by digest and attests its SBOM. It opens nothing.
#
# Signing is keyless: cosign proves this workflow's identity with the job's OIDC token, Sigstore's Fulcio certifies it
# for ten minutes, and the signature goes into Sigstore's public log, Rekor. There is no key to keep or steal. The
# signature says which workflow, in which repository, on which ref made the image: only `build.yml` on main is
# trusted, by the factory's deploy watch and the deploy pull request's checks alike.
#
# Argo CD deploys only what is in git, so a new image reaches the local cluster through a pull request that pins its
# digest in deploy/overlays/local. Software Factory's GitHub worker sees the new image in GHCR and opens that pull
# request as the factory's App: one at a time, always for the latest build.
name: build

on:
  push:
    branches: [main]
    # Only what goes into the image. Merging the deploy pull request must not build again, and nor must a release:
    # it changes only package.json's version. The image's dependencies come from the lockfile.
    paths:
      - src/**
      - public/**
      - data/**
      - scripts/seed.ts
      - Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Laptops are arm64; cloud nodes are amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=The World's Worst Website
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Syft's version is pinned once, in deploy/images/syft/Dockerfile, which Dependabot moves: read here from this
  # workflow's own commit, so its bump of that file is the whole change. A job of its own, so that nothing is checked out
  # where the OIDC token can be asked for: a sparse checkout of that one file, with no credentials, and nothing of it
  # runs. Only the version leaves it.
  syft-version:
    name: Syft's version
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: deploy/images/syft/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read Syft's version from its pin
        id: pin
        env:
          PIN: deploy/images/syft/Dockerfile
        run: |
          set -euo pipefail
          # One FROM, of Syft's image by version and digest: every FROM line is counted, however it is written, so a
          # second one fails too.
          froms=$(grep -iE '^[[:space:]]*FROM[[:space:]]' "$PIN" || true)
          if [ -z "$froms" ] || [ "$(wc -l <<< "$froms")" -ne 1 ] ||
            [[ ! $froms =~ ^FROM\ ghcr\.io/anchore/syft:(v[0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$PIN must pin Syft's image once, as FROM ghcr.io/anchore/syft:v<version>@sha256:<digest>"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Syft ${BASH_REMATCH[1]}, from $PIN"

  # Signs the image by digest, and attests an SBOM of each of its platforms, made by Syft. A job of its own, so that
  # only it can ask for the workflow's OIDC token, and nothing the image's build runs ever can. If it fails, the image
  # is in GHCR unsigned, and the factory will not propose it until it is run again. A brief failure of Sigstore's or
  # GHCR's is tried again within the job.
  sign:
    name: sign and attest
    # Never without Syft's version: download-syft given none would install whatever Syft is newest.
    needs: [image, syft-version]
    runs-on: ubuntu-24.04
    # Room for every try: three cosign calls with up to four minutes of tries each, the two scans' tries, and up to
    # 105 seconds of waiting between each call's tries.
    timeout-minutes: 30
    permissions:
      packages: write # cosign keeps the signature and attestations beside the image
      id-token: write # the workflow's identity, which Fulcio certifies
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ needs.syft-version.outputs.version }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          DIGEST: ${{ needs.image.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build gave no digest: $DIGEST"; exit 1; }
          ref="$IMAGE@$DIGEST"
          # Fulcio, Rekor and GHCR fail now and then (a 500, a dropped connection) and answer again soon after. Each call
          # to them gets four tries, 15, 30 and 60 seconds apart, and no more: an outage that lasts longer, or a failure
          # that is not theirs, still fails the job, once it has been tried four times. Each cosign try is cut off after
          # a minute, so a service that hangs rather than failing is tried again too, within the job's timeout.
          retry() {
            local try
            for try in 1 2 3 4; do
              "$@" && return 0
              [ "$try" -lt 4 ] || break
              echo "::warning::${1##*/} $2 failed (try $try of 4); trying again in $((15 << (try - 1)))s" >&2
              sleep $((15 << (try - 1)))
            done
            echo "::error::${1##*/} $2 failed four times" >&2
            return 1
          }
          # One SBOM for each platform, each attested on the image index that the cluster pins. The signature comes
          # last, so an image that carries one has its SBOMs too: the factory's deploy watch looks for the signature.
          for platform in linux/amd64 linux/arm64; do
            retry "$SYFT" scan --quiet --platform "$platform" "registry:$ref" --output spdx-json=sbom.spdx.json
            retry cosign attest --yes --timeout 1m --type spdxjson --predicate sbom.spdx.json "$ref"
          done
          retry cosign sign --yes --timeout 1m "$ref"
          echo "$ref: signed, with an SBOM of each platform attested"
