# What a pull request's own events start, apart from its code's checks: its title checked, and main's review gate
# (review.yml) asked to judge it.
#
# Both live in Software Factory's repository and are called at a pinned commit, so this repository and that one keep
# the same title rule, and a change here cannot loosen it. The called workflow has two jobs:
#
# - title: pull requests are squash-merged, so the title becomes the commit on main: it must be a Conventional Commit.
#   On the merge queue's commit it reads the title again from the pull request the queue's branch names. It runs on
#   every event here, a review's included, and is never skipped: a skipped job passes a required check.
# - review requested: does nothing but finish. This workflow's run, which `workflow_run` hears only in its own
#   repository, is what starts review.yml, from main: when a pull request into any branch opens, its head moves, it is
#   reopened, made ready or edited (its base changed, as when the pull request below it in a stack merges), when a
#   label is removed from it (a risk label removed by anyone but Martin holds it), when someone reviews it, and when
#   the merge queue tests it, whose commit needs the `review` check too.
#
# It runs as the pull request or the queue's commit has it, so it holds no token that can write and no secret. A copy
# changed by a pull request, or another workflow given its name, can only make the honest gate look again, or leave a
# check missing, which holds the pull request as a failing check does.
name: pull request
# A run on the merge queue's commit is named by the queue's branch, which names its pull request; on a pull request,
# an empty name leaves GitHub's own, the pull request's title.
run-name: ${{ github.event_name == 'merge_group' && format('queue · {0}', github.event.merge_group.head_ref) || '' }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  pull-request:
    name: pull request
    permissions:
      contents: read
      pull-requests: read # the title of the pull request a merge queue's commit was made for
    uses: the-roganator/cv-software-factory/.github/workflows/pull-request.yml@adfb13c4017363bcb193e83199d142b4e45b0bfc # main
