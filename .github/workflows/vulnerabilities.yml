# The daily scan: every image, chart and lockfile this repository runs or pins, read against the day's advisories,
# each finding an alert in this repository's code scanning, in the categories `vulnerabilities/01` to
# `vulnerabilities/20`.
#
# The scan lives in Software Factory's repository and is called at a pinned commit, whose rules find what this
# repository runs or pins (its lockfile, deploy overlay and Dockerfiles) and whose own pin names the scanner, so a
# change here cannot narrow it. It checks this repository out as data and runs nothing from it.
#
# Each finding has a deadline, and the scan fails on a new High or Critical with a fix, one due within a day, or one
# past its deadline. It groups the findings into moves, each the change that fixes some of them, and uploads them as
# the artifact `moves` (`moves.json`), which the factory's App reads from main's last finished run.
#
# It runs daily, for the day's new advisories, on each push to main, for what changed, and by hand on main after a
# failed day. On a pull request that changes this file it makes its proving run instead: the same scan of the base,
# whose jobs ask for no permission to upload, so nothing reaches code scanning, with the deadlines' counts and the
# moves in its log, failing on none of them.
#
# On a push to main it also submits the dependency graph: every package the lockfile resolves, indirect ones included,
# sent to GitHub's dependency submission API, so the graph and Dependabot's alerts hold the whole lockfile and not only
# what package.json names. The graph's workflow lives beside the scan, at the same commit, and reads this repository's
# checkout as data.
name: vulnerabilities

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vulnerabilities.yml

permissions: {}

jobs:
  vulnerabilities:
    # The most the called jobs may have: the upload's `security-events: write` reaches only its job on main, which
    # refuses any other event; the proving run's job asks for `contents`, `packages` and `security-events: read`, to
    # read when each alert was made.
    permissions:
      contents: read
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: write # upload the results to code scanning
    # One scan at a time for a branch, none cancelled once it has started: on main each run uploads every category, and
    # an older run finishing last would leave its results in place of a newer one's. On the scan's job alone, so that a
    # push's graph never waits behind the schedule's or a run by hand, where GitHub would drop it for the next pending.
    concurrency:
      group: vulnerabilities-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    uses: the-roganator/cv-software-factory/.github/workflows/vulnerabilities.yml@aa9c44e56333d77edf1c6f146ed095591d13d744 # main

  dependency-graph:
    # On a push alone: the graph's job refuses any other event, so it is not called on the schedule, by hand or on a
    # pull request, and `contents: write` reaches nothing else here. Its called job runs one submission at a time, a
    # newer push's waiting in place of an older one's, so the graph ends at the newest commit.
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write # the dependency submission API, with the job's token
    uses: the-roganator/cv-software-factory/.github/workflows/dependency-graph.yml@aa9c44e56333d77edf1c6f146ed095591d13d744 # main
