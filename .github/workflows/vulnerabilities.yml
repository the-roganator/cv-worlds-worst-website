# The daily scan: every image, chart and lockfile this repository runs or pins, read against the day's advisories,
# each finding an alert in this repository's code scanning, in the categories `vulnerabilities/01` to
# `vulnerabilities/20`.
#
# The scan lives in Software Factory's repository and is called at a pinned commit, whose rules find what this
# repository runs or pins (its lockfile, deploy overlay and Dockerfiles) and whose own pin names the scanner, so a
# change here cannot narrow it. It checks this repository out as data and runs nothing from it.
#
# Each finding has a deadline, and the scan fails on a new High or Critical with a fix, one due within a day, or one
# past its deadline. It groups the findings into moves, each the change that fixes some of them, and uploads them as
# the artifact `moves` (`moves.json`), with every open finding counted by severity, for the factory's GitHub worker to
# read from main's last finished run.
#
# Between runs it keeps each finding's days in the artifact `state` of its run, sealed with this repository's key,
# `SCAN_STATE_KEY`, which the environment `scan-state` holds and only main may use. The next run reads the last one's
# in place of every alert; with none it can open, it reads the alerts, which hold the same days.
#
# Main's runs keep, in this repository's Actions cache, Trivy's analysis of each image layer and the day's lookups of
# registries and releases; a pull request's proving run restores them and never saves. No verdict depends on either:
# the advisory databases and the exceptions are read afresh every run.
#
# It runs daily, for the day's new advisories, on each push to main, for what changed, and by hand on main after a
# failed day. On a pull request that changes this file it makes its proving run instead: the same scan of the base,
# whose jobs ask for no permission to upload, so nothing reaches code scanning. Its log has the deadlines' counts and
# the moves, and it uploads the artifact `moves`; it fails on none of the deadlines, but, as the scan does, on any
# source it cannot read.
#
# On a push to main it also submits the dependency graph: every package the lockfile resolves, indirect ones included,
# sent to GitHub's dependency submission API, so the graph and Dependabot's alerts hold the whole lockfile and not only
# what package.json names. The graph is a job of the same called workflow, beside the scan, and reads this repository's
# checkout as data.
name: vulnerabilities

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vulnerabilities.yml

permissions: {}

jobs:
  vulnerabilities:
    # The most the called jobs may have, each job taking only what it names: `security-events: write` reaches only the
    # scan's job on main, which refuses any other event, to upload its results and hold its categories' alerts to the
    # factory's exceptions (an alert dismissed with no exception in force is reopened), and `actions: read` to read the
    # last run's state; `contents: write` reaches only the graph's job, on a push alone, for the dependency submission
    # API; the proving runs' jobs ask for `contents`, `packages` and `security-events: read`, to read when each alert
    # was made. One upload at a time is the called scan job's own concurrency, for this repository, so the graph, beside
    # it, never waits behind the schedule's scan or a run by hand.
    permissions:
      actions: read # the last run's state, an artifact of that run
      contents: write # the dependency submission API, with the graph job's token
      packages: read # the advisory database and the images in GHCR, with the job's token
      security-events: write # upload the results to code scanning
    uses: the-roganator/cv-software-factory/.github/workflows/vulnerabilities.yml@adfb13c4017363bcb193e83199d142b4e45b0bfc # main
    # The called job names the `scan-state` environment, this repository's, but a secret reaches it only when the
    # caller passes it, even one held in that environment alone. The called workflow declares the key, so it is passed
    # by name, and nothing else is.
    secrets:
      SCAN_STATE_KEY: ${{ secrets.SCAN_STATE_KEY }}
